name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check --min-severity warn

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - name: Run the tests with branch coverage
        run: uv run coverage run -m pytest
      - name: Require 100% line and branch coverage
        run: uv run coverage report

  lowest-direct:
    name: Test with lowest direct dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --resolution lowest-direct --all-extras --all-groups
      - run: uv run pytest -m "not live and not examples"

  examples:
    name: Examples and benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - name: Test the examples
        run: uv run pytest tests/examples tests/docs/test_examples.py -m "examples or not examples" --no-cov
      - name: Check the recorded output of every offline example
        run: uv run python examples/verify_examples.py
      - name: Benchmark smoke run
        run: uv run python benchmarks/bench_middleware.py --smoke

  postgres:
    name: PostgreSQL provenance example
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contextsage
          POSTGRES_PASSWORD: contextsage
          POSTGRES_DB: contextsage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextsage -d contextsage"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - name: Exercise PostgreSQL-backed provenance
        env:
          CONTEXTSAGE_POSTGRES_DSN: postgresql://contextsage:contextsage@localhost:5432/contextsage
        run: uv run python examples/postgres_store.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked --only-group docs
      - name: Check that the API reference matches the source
        run: uv run --no-sync python scripts/generate_api_reference.py --check
      - run: uv run --no-sync zensical build --strict

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
      - run: uv build
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Check the wheel contents
        run: |
          uv run --no-project python - <<'PY'
          import zipfile
          from pathlib import Path

          (wheel,) = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert "contextsage/py.typed" in names, "py.typed is missing"
          unexpected = [
              name
              for name in names
              if not name.startswith(("contextsage/", "contextsage-"))
          ]
          assert not unexpected, f"unexpected files in the wheel: {unexpected}"
          PY
      - name: Install and verify the core wheel without integration extras
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" - <<'PY'
          import importlib
          import importlib.util

          import contextsage

          for module in (
              "contracts",
              "engine",
              "errors",
              "events",
              "messages",
              "parsing",
              "policies",
              "provenance",
              "sinks",
              "tokens",
          ):
              importlib.import_module(f"contextsage.{module}")

          for optional in ("langchain", "langchain_core", "langgraph"):
              assert importlib.util.find_spec(optional) is None, (
                  f"{optional} was installed by the core package"
              )
          print(contextsage.__version__)
          PY
      - name: Run the framework-neutral quickstart with the isolated wheel
        env:
          PYTHONPATH: examples
        run: "$RUNNER_TEMP/wheel/bin/python examples/quickstart.py"
      - name: Install and import the source distribution
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/sdist"
          uv pip install --python "$RUNNER_TEMP/sdist/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/sdist/bin/python" -c "import contextsage; print(contextsage.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
