# Prometheus scrape configuration for examples/observability_prometheus.py.
#
# Start the example, then run Prometheus with this file, for example:
#
#   docker run --rm -p 9090:9090 \
#     -v "$PWD/examples/observability_prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
#     prom/prometheus
#
# and query contextsage_summarizations_total, contextsage_input_tokens,
# contextsage_output_tokens, contextsage_compression_ratio or
# contextsage_latency_ms. Replace the target with wherever the example runs.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: contextsage
    static_configs:
      - targets: ["host.docker.internal:9109"]
