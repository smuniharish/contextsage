# Prometheus scrape configuration for examples/observability_prometheus.py.
#
# Run the exporter and Prometheus containers on the same Podman network.
#
# Query contextsage_summarizations_total, contextsage_input_tokens,
# contextsage_output_tokens, contextsage_compression_ratio or
# contextsage_latency_ms. Replace the target with wherever the example runs.

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: contextsage
    static_configs:
      - targets: ["contextsage-prometheus-exporter:9109"]
