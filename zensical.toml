# Documentation site built with Zensical.

[project]
site_name = "ContextSage"
site_description = "Async, framework-neutral context summarization for AI agents, with optional integrations."
site_url = "https://contextsage.readthedocs.io/en/latest/"
site_author = "S MUNI HARISH"
repo_name = "smuniharish/contextsage"
repo_url = "https://github.com/smuniharish/contextsage"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; 2026 S MUNI HARISH. Apache License 2.0."
extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "User guide" = [
    { "How it works" = "guide/how-it-works.md" },
    { "Configuration" = "guide/configuration.md" },
    { "Preservation policies" = "guide/policies.md" },
    { "Content parsing" = "guide/content-parsing.md" },
    { "Validation and recovery" = "guide/validation-recovery.md" },
    { "Observability" = "guide/observability.md" },
    { "Provenance and lineage" = "guide/provenance.md" },
    { "Framework and package integrations" = "guide/integrations.md" },
  ] },
  { "Examples" = "examples.md" },
  { "Architecture" = "architecture.md" },
  { "Operations" = [
    { "Production checklist" = "operations/production.md" },
    { "Performance" = "operations/performance.md" },
    { "Security and privacy" = "operations/security.md" },
  ] },
  { "Agent Skills" = "agent-skills.md" },
  { "API reference" = "reference/index.md" },
  { "Project" = [
    { "Changelog" = "changelog.md" },
    { "Contributing" = "development/contributing.md" },
    { "Testing" = "development/testing.md" },
  ] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true

[project.theme]
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/smuniharish/contextsage"
name = "ContextSage on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/contextsage/"
name = "ContextSage on PyPI"

[project.plugins.glightbox]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
