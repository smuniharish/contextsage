# Run `uvx pre-commit install` once to check every commit locally.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check --min-severity warn
        language: system
        pass_filenames: false
        types: [python]
